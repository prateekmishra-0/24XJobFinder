name: Job Hunter Pipeline

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# 1. ARCHITECTURAL SAFEGUARD: Prevents parallel runs and database collisions
concurrency:
  group: job-hunter-pipeline
  cancel-in-progress: false

jobs:
  pipeline-tasks:
    runs-on: ubuntu-latest
    # 2. ARCHITECTURAL SAFEGUARD: Circuit breaker to prevent infinite hangs
    timeout-minutes: 20
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          # 3. ARCHITECTURAL SAFEGUARD: Optimizes dependency caching
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. ARCHITECTURAL SAFEGUARD: Kept as separate steps for clean UI logging
      - name: Run Followup (Callbacks/Reminders)
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python followup.py

      - name: Run Job Hunter (Discovery)
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: python hunter.py
