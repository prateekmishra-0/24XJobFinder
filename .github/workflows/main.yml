name: Job Hunter Pipeline
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Prevents parallel runs and database collisions
concurrency:
  group: job-hunter-pipeline
  cancel-in-progress: false

jobs:
  pipeline-tasks:
    runs-on: ubuntu-latest
    # Hard emergency backstop ONLY.
    # hunter.py has a 25-minute soft timeout that exits the loop cleanly,
    # saves the MongoDB bookmark, and lets the runner free up gracefully.
    # This YAML timeout should never fire under normal conditions.
    # It exists only to kill the container if a frozen TCP socket or
    # unexpected hang bypasses all internal timeouts.
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Followup (Callbacks/Reminders)
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python followup.py

      - name: Run Job Hunter (Discovery)
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        run: python hunter.py
